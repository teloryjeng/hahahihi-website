<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Haha Hihi Kidswear</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/wafloat.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/script/loadpart.js"></script>
    <link rel="icon" type="image/png" href="/asset/img/favico.png">
    <link rel="apple-touch-icon" href="/asset/img/favico.png">
</head>

<body>
    <div id="header-placeholder"></div>

    <section class="auth-section py-5">
        <div class="container d-flex justify-content-center">
            <div class="auth-card p-4 p-md-5 text-center bg-white" style="max-width: 500px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                <h3 class="fw-bold mb-3">Final Step: Payment</h3>
                <p class="text-muted mb-4">Please scan the QRIS code below to complete your order.</p>
                
                <div class="payment-amount-box p-3 bg-light rounded mb-4 border">
                    <span class="text-muted small d-block mb-1">Total Payment</span>
                    <h2 class="fw-bold text-dark mb-0" id="payment-total">Rp0</h2>
                </div>

                <div class="qr-container p-2 border rounded bg-white mb-4 shadow-sm mx-auto" style="max-width: 300px;">
                    <img src="./asset/img/payment/qr.png" alt="QRIS Payment" class="img-fluid w-100">
                </div>

                <div class="alert alert-warning small text-start mb-4 border-0" style="background-color: #fff9e6;">
                    <h6 class="fw-bold"><i class="bi bi-info-circle me-2"></i>How to Pay:</h6>
                    <ul class="mb-0 ps-3">
                        <li>Open your banking or e-wallet app (GOPAY, OVO, ShopeePay, etc.)</li>
                        <li>Scan the QRIS code above.</li>
                        <li>Verify the amount and complete the payment.</li>
                    </ul>
                </div>

                <button class="btn btn-secondary w-100 py-3 fw-bold shadow-sm" id="countdownBtn" disabled>Checking Payment... 30s</button>
                <a href="index.html" class="btn btn-link text-muted mt-3 text-decoration-none small">Pay Later / Back to Home</a>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const amount = urlParams.get('total');
            if (amount) {
                document.getElementById('payment-total').textContent = amount;
            }

            const countdownBtn = document.getElementById('countdownBtn');
            let timeLeft = 30;

            const timer = setInterval(() => {
                timeLeft--;
                countdownBtn.textContent = `Checking Payment... ${timeLeft}s`;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    countdownBtn.textContent = "Processing Payment...";
                    processPayment();
                }
            }, 1000);

            async function processPayment() {
                const user = JSON.parse(localStorage.getItem('user'));
                if (!user) {
                    window.location.href = "signin.html";
                    return;
                }

                try {
                    const response = await fetch('http://localhost:3000/api/orders/complete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: user.id })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showOverlay("<b>Payment successful!</b><br><br>Thank you for shopping at Haha Hihi Kidswear. Shipping details will be sent via email.", true, "index.html");
                    } else {
                        showOverlay("Payment failed! " + (data.error || "Something went wrong"), false);
                        countdownBtn.textContent = "Payment Failed";
                    }
                } catch (err) {
                    console.error(err);
                    showOverlay("An error occurred connecting to the server.", false);
                    countdownBtn.textContent = "Error";
                }
            }
        });
    </script>
</body>

</html>
