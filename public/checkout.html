<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Haha Hihi Kidswear</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/cart.css">
    <link rel="stylesheet" href="/css/wafloat.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/script/loadpart.js"></script>
    <script src="/script/checkout.js"></script>
    <link rel="icon" type="image/png" href="/asset/img/favico.png">
    <link rel="apple-touch-icon" href="/asset/img/favico.png">
</head>

<body>
    <div id="header-placeholder"></div>

    <section class="checkout-section py-5">
        <div class="container">
            <h2 class="cart-title mb-5">Checkout</h2>
            
            <div class="row g-4">
                <!-- Delivery Details Form -->
                <div class="col-lg-8">
                    <div class="cart-card p-4 mb-4">
                        <h5 class="fw-bold mb-4 border-bottom pb-3"><i class="bi bi-geo-alt me-2"></i>Delivery Information</h5>
                        <form id="checkoutForm">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="recipientName" placeholder="Recipient Name" maxlength="50" required>
                                        <label for="recipientName">Recipient Name</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="phoneNumber" placeholder="Phone Number" maxlength="15" required>
                                        <label for="phoneNumber">Phone Number</label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-floating mb-3">
                                        <textarea class="form-control" id="fullAddress" placeholder="Full Address" style="height: 100px" maxlength="250" required></textarea>
                                        <label for="fullAddress">Full Address</label>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="city" placeholder="City" maxlength="50" required>
                                        <label for="city">City / District</label>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="province" placeholder="Province" maxlength="50" required>
                                        <label for="province">Province</label>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="postalCode" placeholder="Postal Code" maxlength="5" required>
                                        <label for="postalCode">Postal Code</label>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Order Summary -->
                <div class="col-lg-4">
                    <div class="cart-card p-4 sticky-top" style="top: 100px;">
                        <h5 class="fw-bold mb-4 border-bottom pb-3">Payment Details</h5>
                        <div id="checkout-items-summary" class="mb-4 small border-bottom pb-3">
                            <!-- Ringkasan item singkat -->
                            <p class="text-muted">Memuat rincian...</p>
                        </div>
                        
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">Subtotal</span>
                            <span class="fw-medium" id="subtotal-price">Rp0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">Shipping Cost</span>
                            <span class="fw-medium" id="shipping-price">Rp20.000</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">Tax (11%)</span>
                            <span class="fw-medium" id="tax-price">Rp0</span>
                        </div>
                        
                        <hr class="mb-4">
                        
                        <div class="d-flex justify-content-between mb-4">
                            <h5 class="fw-bold">Total Payment</h5>
                            <h5 class="fw-bold text-dark" id="total-price">Rp0</h5>
                        </div>
                        
                        <button type="submit" form="checkoutForm" class="btn btn-checkout w-100 py-3 text-uppercase fw-bold">Place Order</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>
</body>

</html>
