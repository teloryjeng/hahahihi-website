<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flanel Shirt - Haha Hihi Kidswear</title>
    <script src="/script/carousel.js"></script>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/product-detail.css"> <!-- CSS Baru -->
    <link rel="stylesheet" href="/css/wafloat.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/script/loadpart.js"></script>
    <script src="/script/loadproductdetail.js"></script>
    <link rel="icon" type="image/png" href="/asset/img/favico.png">
    <link rel="apple-touch-icon" href="/asset/img/favico.png">
</head>
<body>

    <div id="header-placeholder"></div>

    <!-- Product Detail Section -->
    <section class="product-detail py-5">
        <div class="container">
            <div class="row">
                <!-- Left: Product Images Gallery -->
                <div class="col-md-7">
                    <div class="row g-3" id="product-images-container">
                        <!-- Product images akan dimuat dari script -->
                    </div>
                </div>
                <!-- Right: Product Info -->
                <div class="col-md-5">
                    <div class="product-info-box p-4 sticky-top" style="top: 100px; z-index: 1;">
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item"><span class="text-dark" id="breadcrumb-text"><i class="bi bi-arrow-return-right"></i> BOYS | Tops</span></li>
                            </ol>
                        </nav>
                        <h2 class="fw-bold" id="product-name">Flanel Shirt</h2>
                        <p class="text-muted" id="product-desc">A timeless checkered/plaid pattern featuring a warm palette of camel, beige, dark brown, and white.</p>
                        
                        <div class="size-selection my-4">
                            <h6>Select Size</h6>
                            <div class="d-flex gap-2 flex-wrap" id="product-sizes-container">
                                <!-- Sizes akan dimuat dari script -->
                            </div>
                        </div>

                        <h4 class="fw-bold mb-3" id="product-price">Rp130.000</h4>
                        <button class="btn btn-dark w-100 py-2 checkout-btn" id="add-to-cart-btn">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

<div id="footer-placeholder"></div>
<!-- Modal Overlay -->
<div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content bg-transparent border-0">
            <div class="modal-body p-0 position-relative">
                <!-- Tombol Close Putih -->
                <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Close" style="z-index: 1060;"></button>
                
                <div id="carouselExample" class="carousel slide" data-bs-ride="false">
                    <div class="carousel-inner" id="modal-carousel-inner">
                        <!-- Carousel items akan dimuat dari script -->
                    </div>
                    
                    <!-- Navigasi Panah -->
                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

</body>

</html>
