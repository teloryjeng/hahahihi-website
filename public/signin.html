<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Haha Hihi Kidswear</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/wafloat.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/script/loadpart.js"></script>
    <script src="/script/login.js"></script>
    <link rel="icon" type="image/png" href="/asset/img/favico.png">
    <link rel="apple-touch-icon" href="/asset/img/favico.png">
</head>

<body>
    <div id="header-placeholder"></div>

    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-card">
                <div class="row g-0">
                    <div class="col-md-6 d-none d-md-flex">
                        <img src="/asset/img/home/hero2.jpg" alt="Auth Image" class="auth-image w-100">
                    </div>
                    <div class="col-md-6 d-flex align-items-center justify-content-center">
                        <div class="auth-form-container w-100 p-4 p-md-5">
                            <h2 class="auth-title mb-2">Welcome Back</h2>
                            <p class="auth-subtitle mb-4">Please sign in to your account</p>
                            <form id="signinForm">
                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control" id="floatingInput"
                                        placeholder="name@example.com">
                                    <label for="floatingInput">Email address</label>
                                </div>
                                <div class="form-floating mb-3 position-relative">
                                    <input type="password" class="form-control" id="floatingPassword"
                                        placeholder="Password">
                                    <label for="floatingPassword">Password</label>
                                    <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y me-2 border-0 shadow-none toggle-password">
                                        <i class="bi bi-eye text-muted"></i>
                                    </button>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                                        <label class="form-check-label text-muted" for="rememberMe">
                                            Remember me
                                        </label>
                                    </div>
                                    <a href="#" class="auth-link text-muted">Forgot Password?</a>
                                </div>
                                <button type="submit" class="btn btn-auth w-100 py-3 mb-3">Sign In</button>
                                <p class="text-center text-muted mb-0">Don't have an account? <a href="/signup.html"
                                        class="auth-link fw-bold">Sign Up</a></p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>
</body>

</html>
