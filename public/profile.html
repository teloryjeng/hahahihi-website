<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - Haha Hihi Kidswear</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/wafloat.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/script/loadpart.js"></script>
    <script src="/script/profile.js"></script>
    <link rel="icon" type="image/png" href="/asset/img/favico.png">
    <link rel="apple-touch-icon" href="/asset/img/favico.png">
</head>

<body>
    <div id="header-placeholder"></div>

    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-card" style="max-width: 500px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-radius: 20px; overflow: hidden;">
                <div class="auth-form-container p-4 p-md-5 bg-white">
                    <h2 class="auth-title mb-2 text-center">Account Settings</h2>
                    <p class="auth-subtitle mb-4 text-center text-muted">Update your profile or manage your account</p>
                    
                    <form id="profileForm" class="mb-5">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="profileName" placeholder="Username" required>
                            <label for="profileName">Username</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="email" class="form-control" id="profileEmail" placeholder="Email" disabled style="background-color: #f8f9fa;">
                            <label for="profileEmail">Email address (Verified)</label>
                        </div>
                        <button type="submit" class="btn btn-auth w-100 py-3 shadow-sm">Update Username</button>
                    </form>

                    <hr class="my-4">

                    <h5 class="fw-bold mb-3">Change Password</h5>
                    <form id="passwordForm">
                        <div class="form-floating mb-3 position-relative">
                            <input type="password" class="form-control" id="currentPassword" placeholder="Current Password" required>
                            <label for="currentPassword">Current Password</label>
                            <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y border-0 toggle-password" tabindex="-1">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="form-floating mb-3 position-relative">
                            <input type="password" class="form-control" id="newPassword" placeholder="New Password" required>
                            <label for="newPassword">New Password</label>
                            <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y border-0 toggle-password" tabindex="-1">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="form-floating mb-4 position-relative">
                            <input type="password" class="form-control" id="confirmNewPassword" placeholder="Confirm New Password" required>
                            <label for="confirmNewPassword">Confirm New Password</label>
                            <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y border-0 toggle-password" tabindex="-1">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <button type="submit" class="btn btn-outline-dark w-100 py-3 mb-4 shadow-sm">Change Password</button>
                    </form>

                    <div class="pt-3 border-top mt-2">
                        <div class="d-flex align-items-center mb-3">
                            <i class="bi bi-exclamation-triangle text-danger me-2 fs-5"></i>
                            <h6 class="text-danger mb-0">Danger Zone</h6>
                        </div>
                        <p class="small text-muted mb-3">Once you delete your account, there is no going back. All your data including cart history will be permanently erased.</p>
                        <button type="button" class="btn btn-outline-danger w-100 py-2" id="deleteAccountBtn">Delete Account</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>
</body>

</html>
